# Checks of the repository.
#
# The quick job runs the Go code's vet, format and lint checks, and the
# tests that need no compiler (spec references, the diagnostics catalog,
# the bootstrap tool).
#
# The compiler job builds compiler/cmd/pluto at the commit with the release
# compiler (tools/bootstrap's releaseTag), checks that compiler/ and lib/
# are pluto fmt-formatted, and runs every test with the new compiler: about
# 10 minutes to build and 50 to test. It does not run on a push to main:
# every push to main has already passed the same build, tests and a
# three-stage bootstrap on kraken before it is pushed (the integration
# gate), and repeating them took one of kraken's build slots for an hour
# per push. It runs daily on main, on pull requests and on demand. The
# fixpoint job then checks that the new compiler rebuilds itself byte for
# byte (pluto2 == pluto3); it runs weekly and on demand.
#
# Where the jobs run: the repository variable RUNS_ON, as JSON. While the
# repository is private it is unset, and the jobs run on the self-hosted
# runner on kraken (labels self-hosted and kraken), which costs no Actions
# minutes. There the heavy steps wait for one of kraken's two build slots
# (~/build/slot.sh), which local builds share. To run on GitHub's runners,
# set RUNS_ON to "ubuntu-latest" (with the quotes).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 10 * * 0" # weekly with the fixpoint, Sunday 03:47 Pacific
    - cron: "17 11 * * 1-6" # daily compiler job, 04:17 Pacific
  workflow_dispatch:
    inputs:
      fixpoint:
        description: "Also run the self-build fixpoint"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Whether the fixpoint job runs, and so needs the compiler as an artifact.
  FIXPOINT: ${{ (github.event_name == 'schedule' && github.event.schedule == '47 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.fixpoint) }}

jobs:
  quick:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","kraken"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # kraken keeps its module and build caches between runs; restoring
          # the Actions cache over them floods the log with tar errors.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: tests without a compiler
        # The compiler tests skip when no compiler is given.
        run: go test -count=1 ./...

  compiler:
    needs: quick
    # Not on a push to main: see the comment at the top.
    if: github.event_name != 'push'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","kraken"]') }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # kraken keeps its module and build caches between runs; restoring
          # the Actions cache over them floods the log with tar errors.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: tools
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y binutils qemu-system-x86
      - name: build slot
        # On kraken, the heavy steps run in a build slot.
        if: runner.environment == 'self-hosted'
        run: echo "SLOT=bash $HOME/build/slot.sh" >> "$GITHUB_ENV"
      - name: release compiler
        run: go run ./tools/bootstrap -stages 0 -work "$RUNNER_TEMP/bs"
      - name: build the compiler at this commit
        run: |
          PLUTOROOT=$PWD/lib $SLOT "$RUNNER_TEMP/bs/pluto0" build -O2 --gencheck=false -o pluto ./compiler/cmd/pluto
          ./pluto version
      - name: pluto fmt
        run: |
          out=$(./pluto fmt -l $(git ls-files 'compiler/*.p' 'lib/*.p'))
          if [ -n "$out" ]; then echo "not pluto fmt-formatted:"; echo "$out"; exit 1; fi
      - name: tests
        run: PLUTO_TEST_COMPILER=$PWD/pluto $SLOT go test -count=1 -timeout 150m ./...
      - uses: actions/upload-artifact@v4
        if: env.FIXPOINT == 'true'
        with:
          name: pluto-x86_64-linux
          path: pluto
          retention-days: 1

  fixpoint:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 10 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.fixpoint)
    needs: compiler
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","kraken"]') }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # kraken keeps its module and build caches between runs; restoring
          # the Actions cache over them floods the log with tar errors.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/download-artifact@v4
        with:
          name: pluto-x86_64-linux
      - name: build slot
        if: runner.environment == 'self-hosted'
        run: echo "SLOT=bash $HOME/build/slot.sh" >> "$GITHUB_ENV"
      - name: pluto2 and pluto3 must be identical
        run: |
          chmod +x pluto
          $SLOT go run ./tools/bootstrap -pluto1 ./pluto -stages 3 -work "$RUNNER_TEMP/fix"
