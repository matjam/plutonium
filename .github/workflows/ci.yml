# Checks of the repository.
#
# Every push and pull request runs the quick job: the Go code's vet, format
# and lint checks, and the tests that need no compiler (spec references,
# the diagnostics catalog, the bootstrap tool).
#
# The compiler job builds compiler/cmd/pluto at the commit with the release
# compiler (tools/bootstrap's releaseTag) and runs every test with it. A
# self build takes about 15 minutes and the tests about 25 on a hosted
# runner, so it runs nightly, on demand, and on pull requests labeled
# "compiler". The fixpoint job then checks that the new compiler rebuilds
# itself byte for byte (pluto2 == pluto3); it runs weekly and on demand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 9 * * *" # nightly, 02:17 Pacific
    - cron: "47 10 * * 0" # weekly with the fixpoint, Sunday 03:47 Pacific
  workflow_dispatch:
    inputs:
      fixpoint:
        description: "Also run the self-build fixpoint"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: tests without a compiler
        # The compiler tests skip when no compiler is given.
        run: go test -count=1 ./...

  compiler:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'compiler'))
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PLUTO_ESCAPE: new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y binutils qemu-system-x86
      - name: release compiler
        run: go run ./tools/bootstrap -stages 0 -work "$RUNNER_TEMP/bs"
      - name: build the compiler at this commit
        run: |
          PLUTOROOT=$PWD/lib "$RUNNER_TEMP/bs/pluto0" build -O2 --gencheck=false -o pluto ./compiler/cmd/pluto
          ./pluto version
      - name: tests
        run: PLUTO_TEST_COMPILER=$PWD/pluto go test -count=1 -timeout 100m ./...
      - uses: actions/upload-artifact@v4
        with:
          name: pluto-x86_64-linux
          path: pluto
          retention-days: 7

  fixpoint:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 10 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.fixpoint)
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PLUTO_ESCAPE: new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: pluto-x86_64-linux
      - name: pluto2 and pluto3 must be identical
        run: |
          chmod +x pluto
          go run ./tools/bootstrap -pluto1 ./pluto -stages 3 -work "$RUNNER_TEMP/fix"
