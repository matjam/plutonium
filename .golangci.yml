version: "2"

issues:
  # Report every issue rather than the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  settings:
    errcheck:
      # internal/pu.Buf mirrors strings.Builder, whose writes never fail and
      # which errcheck already exempts.
      exclude-functions:
        - (*github.com/matjam/plutonium/internal/pu.Buf).Write
        - (*github.com/matjam/plutonium/internal/pu.Buf).WriteByte
        - (*github.com/matjam/plutonium/internal/pu.Buf).WriteRune
        - (*github.com/matjam/plutonium/internal/pu.Buf).WriteString
  exclusions:
    rules:
      # internal/types2 is forked from go/types, which dot-imports its error
      # codes package everywhere; qualifying hundreds of codes would only make
      # the fork harder to compare with upstream.
      - path: internal/types2/
        linters: [staticcheck]
        text: "ST1001:"
